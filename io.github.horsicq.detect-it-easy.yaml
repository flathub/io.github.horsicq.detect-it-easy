app-id: io.github.horsicq.detect-it-easy
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: die

rename-desktop-file: die.desktop

finish-args:
  - --device=dri
  - --share=ipc
  - --share=network # For uploading files to VirusTotal.
  - --socket=wayland
  - --socket=fallback-x11

modules:
  - name: detect-it-easy
    buildsystem: cmake-ninja
    post-install:
      - desktop-file-edit --remove-key Version /app/share/applications/die.desktop
    sources:
      - type: archive
        url: https://github.com/horsicq/DIE-engine/releases/download/4.0.0/die_sourcecode_4.0.0.tar.gz
        sha256: 3bd3cf72d6cccb1525841bd1a22d0e3e3623915c7cc29ab7491024a75595ce2f
        x-checker-data:
          type: anitya
          project-id: 382809
          url-template: https://github.com/horsicq/DIE-engine/releases/download/$version/die_sourcecode_$version.tar.gz
      # TODO: Remove these on the next stable release
      - type: patch
        paths:
          - patches/0001-linux-metadata-add-changelog-for-the-last-4-versions.patch # https://github.com/horsicq/DIE-engine/commit/7337996645fcdf69233c2cc0ac7c46a4af85eae4
